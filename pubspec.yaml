name: flat_buffers_generator
description: A build_runner builder for generating Dart code from FlatBuffers schema (.fbs) files using flatc.
version: 1.0.1
repository: https://github.com/poirierlouis/flat_buffers_generator

environment:
  sdk: ^3.11.0

dependencies:
  build: ^4.0.11
  glob: ^2.1.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.5.20
  lints: ^6.0.0
  logging: ^1.2.0
  test: ^1.25.6
